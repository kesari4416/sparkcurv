server {
    listen 80;
    server_name localhost;

    # Security headers. Defined only at server level on purpose: an add_header inside a
    # location block would silently drop all of these for that location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Browsers ignore HSTS over plain http; it takes effect once TLS is in front.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Report-only until checked in a browser: GA4 loads from several Google domains.
    # Open the site, check the console for CSP reports, then rename the header to
    # Content-Security-Policy to enforce it.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API → FastAPI backend.
    location /api/ {
        # The app accepts 5 MB image uploads; nginx's default limit is 1 MB.
        client_max_body_size 6m;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Everything else → the Next.js server (pages, /_next/static, /public files).
    # Next sets its own cache headers: immutable for hashed /_next/static files,
    # revalidate for pages.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
